<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CollabForge · semantic search</title>
  <!-- DM Sans clean, modern font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0c;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      letter-spacing: -0.01em;
      font-weight: 400;
    }

    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* header – ultra clean */
    .header {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header h1 span {
      font-weight: 300;
      color: #a1a1aa;
      font-size: 1.8rem;
    }

    .header p {
      font-size: 1.1rem;
      font-weight: 400;
      color: #8e8e93;
      max-width: 500px;
      line-height: 1.5;
    }

    /* stats minimal row */
    .stats {
      display: flex;
      align-items: center;
      gap: 3rem;
      background: #161618;
      border-radius: 1.25rem;
      padding: 1.25rem 2rem;
      width: fit-content;
      border: 1px solid #2c2c2e;
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.95rem;
      font-weight: 400;
      color: #98989e;
      text-transform: lowercase;
      letter-spacing: -0.01em;
    }

    /* main grid - refined spacing */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 820px) {
      .main-content {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .header h1 {
        font-size: 2.2rem;
      }
    }

    /* card – plain black, soft border, no shadow gradient */
    .card {
      background: #0f0f10;
      border-radius: 1.5rem;
      padding: 1.8rem;
      border: 1px solid #262629;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: border-color 0.2s ease;
    }

    .card h2 {
      font-size: 1.4rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* tabs – sleek pill style */
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: #1c1c1e;
      padding: 0.3rem;
      border-radius: 2.5rem;
      width: fit-content;
      border: 1px solid #2e2e32;
    }

    .tab-btn {
      padding: 0.55rem 1.3rem;
      background: transparent;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #98989e;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: -0.01em;
      background: transparent;
    }

    .tab-btn.active {
      background: #2c2c2e;
      color: #ffffff;
      font-weight: 500;
      box-shadow: none;
    }

    .tab-btn:hover {
      color: #e0e0e0;
      background: #262629;
    }

    .search-box {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #1c1c1e;
      border: 1px solid #2e2e32;
      border-radius: 1.25rem;
      font-size: 1rem;
      font-weight: 400;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      transition: border 0.2s;
      outline: none;
    }

    .search-input::placeholder {
      color: #6c6c74;
      font-weight: 350;
    }

    .search-input:focus {
      border-color: #5e5e64;
      background: #222226;
    }

    .search-btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #f5f5f7;
      color: #0b0b0c;
      border: none;
      border-radius: 2.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: -0.01em;
      background: #ffffff;
      color: #0a0a0b;
      border: 1px solid #ffffff;
    }

    .search-btn:hover {
      background: #e8e8ea;
      border-color: #d4d4d8;
      color: #000000;
    }

    .results {
      margin-top: 0.5rem;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding-right: 0.3rem;
    }

    .result-item {
      background: #1a1a1c;
      padding: 1rem 1.2rem;
      border-radius: 1.1rem;
      border: 1px solid #2a2a2e;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .result-item:hover {
      background: #222226;
      border-color: #3f3f46;
    }

    .result-title {
      font-weight: 500;
      color: #f0f0f0;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .result-description {
      color: #a1a1aa;
      font-size: 0.9rem;
      line-height: 1.5;
      font-weight: 350;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.3rem;
    }

    .badge {
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 500;
      background: #2a2a2e;
      color: #c0c0c8;
      letter-spacing: -0.01em;
      border: 1px solid #3a3a40;
      background: #1f1f23;
    }

    .badge-category {
      background: #1e1e22;
      color: #b0b0c0;
    }

    .badge-status {
      background: #202024;
      color: #aaaab6;
    }

    .badge-upvotes {
      background: #1e201e;
      color: #b0b0a0;
    }

    .badge-similarity {
      background: #1a1f1c;
      color: #9ab0a0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #bcbcc0;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-left: 0.2rem;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #1c1c1e;
      border: 1px solid #2e2e32;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      color: #f0f0f0;
      outline: none;
      transition: border 0.2s;
      font-weight: 400;
    }

    .form-textarea {
      resize: vertical;
      min-height: 95px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #6b6b76;
      background: #222226;
    }

    .tag-input-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.8rem;
      background: #1c1c1e;
      border: 1px solid #2e2e32;
      border-radius: 1rem;
      min-height: 3rem;
    }

    .tag {
      background: #2f2f34;
      color: #eaeaea;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 450;
      border: 1px solid #494950;
    }

    .tag-remove {
      cursor: pointer;
      font-weight: 500;
      color: #b0b0b0;
      margin-left: 0.2rem;
      transition: color 0.1s;
    }

    .tag-remove:hover {
      color: #ffffff;
    }

    .tag-input {
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      min-width: 110px;
      font-size: 0.9rem;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
    }

    .tag-input::placeholder {
      color: #6c6c74;
      font-weight: 350;
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #ffffff;
      color: #0b0b0c;
      border: none;
      border-radius: 2.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.4rem;
      letter-spacing: -0.01em;
      border: 1px solid #ffffff;
    }

    .submit-btn:hover {
      background: #e2e2e4;
      border-color: #cccccc;
    }

    .success-message, .error-message {
      padding: 0.8rem 1.2rem;
      border-radius: 1rem;
      font-size: 0.85rem;
      font-weight: 450;
      border: 1px solid;
    }

    .success-message {
      background: #1a2a1f;
      color: #b0d0b0;
      border-color: #2f4a2f;
    }

    .error-message {
      background: #2a1a1c;
      color: #e0a0a8;
      border-color: #4a2f2f;
    }

    .hidden {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 1.5rem;
      color: #aaaaaa;
      font-size: 0.9rem;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #7a7a80;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: #5a5a60;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        CollabForge
        <span>·</span>
      </h1>
      <p>Semantic search for ideas & projects. Clean, minimal, powerful.</p>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-number" id="ideasCount">0</span>
        <span class="stat-label">ideas</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="projectsCount">0</span>
        <span class="stat-label">projects</span>
      </div>
    </div>

    <div class="main-content">
      <!-- search card -->
      <div class="card">
        <h2>🔍 search</h2>
        <div class="tabs">
          <button class="tab-btn active" data-type="ideas" onclick="setSearchType('ideas')">Ideas</button>
          <button class="tab-btn" data-type="projects" onclick="setSearchType('projects')">Projects</button>
        </div>

        <div class="search-box">
          <input 
            type="text" 
            class="search-input" 
            id="searchQuery"
            placeholder="Describe what you're looking for..."
            onkeypress="if(event.key === 'Enter') performSearch()"
          />
        </div>
        <button class="search-btn" onclick="performSearch()">Search semantically</button>

        <div id="searchResults" class="results"></div>
      </div>

      <!-- submit card -->
      <div class="card">
        <h2>✨ submit new</h2>
        <div class="tabs">
          <button class="tab-btn active" data-type="ideas" onclick="setSubmitType('ideas')">Idea</button>
          <button class="tab-btn" data-type="projects" onclick="setSubmitType('projects')">Project</button>
        </div>

        <div id="successMessage" class="success-message hidden"></div>
        <div id="errorMessage" class="error-message hidden"></div>

        <form id="submitForm" onsubmit="submitEntry(event)">
          <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" class="form-input" id="title" required placeholder="Project or idea title" />
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="description" required placeholder="Short description..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="">Select category</option>
              <option value="IoT">IoT</option>
              <option value="AI/ML">AI/ML</option>
              <option value="Design">Design</option>
              <option value="Mobile App">Mobile App</option>
              <option value="Web Development">Web Development</option>
              <option value="Cybersecurity">Cybersecurity</option>
              <option value="Blockchain">Blockchain</option>
              <option value="Data Science">Data Science</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tags</label>
            <div class="tag-input-container" id="tagsContainer">
              <input 
                type="text" 
                class="tag-input" 
                id="tagInput"
                placeholder="Add tag..."
                onkeypress="handleTagInput(event)"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Required skills</label>
            <div class="tag-input-container" id="skillsContainer">
              <input 
                type="text" 
                class="tag-input" 
                id="skillInput"
                placeholder="Add skill..."
                onkeypress="handleSkillInput(event)"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-select" id="status">
              <option value="pending">Pending</option>
              <option value="in_progress">In Progress</option>
              <option value="validated">Validated</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Submit entry</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let searchType = 'ideas';
    let submitType = 'ideas';
    let tags = [];
    let skills = [];

    window.addEventListener('DOMContentLoaded', () => {
      loadStats();
    });

    function setSearchType(type) {
      searchType = type;
      document.querySelectorAll('.card:first-of-type .tabs .tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`.card:first-of-type .tab-btn[data-type="${type}"]`).classList.add('active');
      document.getElementById('searchResults').innerHTML = '';
    }

    function setSubmitType(type) {
      submitType = type;
      const submitTabs = document.querySelectorAll('.card:last-of-type .tabs .tab-btn');
      submitTabs.forEach(btn => btn.classList.remove('active'));
      submitTabs.forEach(btn => {
        if(btn.getAttribute('data-type') === type) btn.classList.add('active');
      });
    }

    async function loadStats() {
      try {
        const response = await fetch('/api/stats');
        const data = await response.json();
        document.getElementById('ideasCount').textContent = data.ideas_count;
        document.getElementById('projectsCount').textContent = data.projects_count;
      } catch (error) {
        console.error('Error loading stats:', error);
        document.getElementById('ideasCount').textContent = '0';
        document.getElementById('projectsCount').textContent = '0';
      }
    }

    async function performSearch() {
      const query = document.getElementById('searchQuery').value.trim();
      const resultsContainer = document.getElementById('searchResults');
      if (!query) {
        resultsContainer.innerHTML = '<div class="empty-state"><p>Type a query to search</p></div>';
        return;
      }

      resultsContainer.innerHTML = '<div class="loading">Searching…</div>';

      try {
        const response = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, type: searchType, top_k: 10 })
        });
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = `<div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <p>No results for "${escapeHtml(query)}"</p>
          </div>`;
        } else {
          resultsContainer.innerHTML = data.results.map(result => `
            <div class="result-item">
              <div class="result-title">${escapeHtml(result.title)}</div>
              <div class="result-description">${escapeHtml(result.description)}</div>
              <div class="result-meta">
                <span class="badge badge-category">${escapeHtml(result.category)}</span>
                <span class="badge badge-status">${escapeHtml(result.status)}</span>
                <span class="badge badge-upvotes">👍 ${result.upvotes}</span>
                <span class="badge badge-similarity">${(result.similarity_score * 100).toFixed(1)}%</span>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        resultsContainer.innerHTML = `<div class="error-message">Search error: ${error.message}</div>`;
      }
    }

    function handleTagInput(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const input = event.target;
        const value = input.value.trim();
        if (value && !tags.includes(value)) {
          tags.push(value);
          renderTags();
          input.value = '';
        }
      }
    }

    function handleSkillInput(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const input = event.target;
        const value = input.value.trim();
        if (value && !skills.includes(value)) {
          skills.push(value);
          renderSkills();
          input.value = '';
        }
      }
    }

    function renderTags() {
      const container = document.getElementById('tagsContainer');
      const input = document.getElementById('tagInput');
      const tagElements = tags.map(tag => `
        <span class="tag">${escapeHtml(tag)}<span class="tag-remove" onclick="removeTag('${escapeHtml(tag)}')">×</span></span>
      `).join('');
      container.innerHTML = tagElements;
      container.appendChild(input);
    }

    function renderSkills() {
      const container = document.getElementById('skillsContainer');
      const input = document.getElementById('skillInput');
      const skillElements = skills.map(skill => `
        <span class="tag">${escapeHtml(skill)}<span class="tag-remove" onclick="removeSkill('${escapeHtml(skill)}')">×</span></span>
      `).join('');
      container.innerHTML = skillElements;
      container.appendChild(input);
    }

    function removeTag(tag) {
      tags = tags.filter(t => t !== tag);
      renderTags();
    }

    function removeSkill(skill) {
      skills = skills.filter(s => s !== skill);
      renderSkills();
    }

    async function submitEntry(event) {
      event.preventDefault();
      const successMsg = document.getElementById('successMessage');
      const errorMsg = document.getElementById('errorMessage');
      successMsg.classList.add('hidden');
      errorMsg.classList.add('hidden');

      const formData = {
        type: submitType,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        tags: tags,
        required_skills: skills,
        status: document.getElementById('status').value,
        submitted_by: 'user_' + Math.random().toString(36).substr(2, 9)
      };

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        const data = await response.json();

        if (response.ok && data.success) {
          successMsg.textContent = data.message;
          successMsg.classList.remove('hidden');
          document.getElementById('submitForm').reset();
          tags = [];
          skills = [];
          renderTags();
          renderSkills();
          loadStats();
        } else {
          errorMsg.textContent = data.error || 'Submission failed';
          errorMsg.classList.remove('hidden');
        }
      } catch (error) {
        errorMsg.textContent = 'Error: ' + error.message;
        errorMsg.classList.remove('hidden');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
